name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: salesconnect, POSTGRES_PASSWORD: salesconnect, POSTGRES_DB: salesconnect }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesconnect" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:migrate
        env: { DATABASE_URL: postgres://salesconnect:salesconnect@localhost:5432/salesconnect }
