services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salesconnect
      POSTGRES_PASSWORD: salesconnect
      POSTGRES_DB: salesconnect
    ports: ["5432:5432"]
    volumes: ["salesconnect_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesconnect"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://salesconnect:salesconnect@postgres:5432/salesconnect
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4380:4380"]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      SALES_CONNECT_URL: http://server:4380
      SALES_CONNECT_API_KEY: ${SALES_CONNECT_ADMIN_API_KEY}
      SALES_CONNECT_TENANT: demo
    depends_on: [server]
    ports: ["3000:3000"]
volumes:
  salesconnect_pg:
